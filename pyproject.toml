[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workforce_scheduler"
version = "1.0.0"
description = "Fuzzy Logic-Based Workforce Scheduling System Optimized by Genetic Algorithm"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Antigravity Research Team"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
