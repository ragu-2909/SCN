# Configuration for Workforce Scheduling System
# Soft Computing AAT - Default Configuration

scenario:
  name: "default_workforce"
  num_workers: 20
  operating_days: 5
  hours_per_day: [11, 11, 11, 11, 7]  # Day 1-4: 11h, Day 5: 7h (51 total slots)
  demand_per_slot: 4                  # At least 4 workers at all times (204 worker-hours)
  max_weekly_hours: 25.0              # Legal/institutional maximum
  min_shift_length: 1.0               # Minimum shift duration in hours
  slot_duration_hours: 1.0            # Resolution

preferences:
  pref_weekly_hours_min: 5.0
  pref_weekly_hours_max: 15.0
  pref_shift_length_min: 3.0
  pref_shift_length_max: 8.0

fuzzy:
  universe_weekly_hours: [0.0, 40.0]
  universe_daily_hours: [0.0, 12.0]
  universe_output: [0.0, 1.0]
  defuzzification: "centroid"
  continuity_scaling_factor: 1.3       # Multiplier when assigned in preceding slot

genetic_algorithm:
  population_size: 50                 # Fast default for interactive UI
  max_generations: 20
  stall_generations: 5
  crossover_rate: 0.8
  mutation_rate: 0.2
  elite_count: 5
  scenarios_per_candidate: 5          # Default quick run scenarios
  chromosome_size: 34
  random_seed: 42
  selection_type: "roulette_wheel"

fairness:
  enable_fairness_metric: true
  jain_index_threshold: 0.8
